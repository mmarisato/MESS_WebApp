    <div id="footer-placeholder"></div>

<div class="product-modal" id="productModal">
  <div class="product-modal__content">
    <button class="product-modal__close" id="modalClose">x</button>
    <img id="modalImage" src="" alt="" />
    <div>
      <h2 id="modalTitle"></h2>
      <p id="modalDescription"></p>
      <p><strong>Materials:</strong> <span id="modalMaterials"></span></p>
    </div>
  </div>
</div>

    <script>
    fetch('/footer.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
      });
  </script>
  <script>
    const modal = document.querySelector("#productModal");
    const modalImage = document.querySelector("#modalImage");
    const modalTitle = document.querySelector("#modalTitle");
    const modalDescription = document.querySelector("#modalDescription");
    const modalMaterials = document.querySelector("#modalMaterials");
    const modalClose = document.querySelector("#modalClose");
  
    document.querySelectorAll(".products-grid .product-card").forEach(card => {
      card.addEventListener("click", () => {
        modalImage.src = card.dataset.image;
        modalImage.alt = card.dataset.title;
        modalTitle.textContent = card.dataset.title;
        modalDescription.textContent = card.dataset.description;
        modalMaterials.textContent = card.dataset.materials;
        modal.classList.add("is-open");
      });
    });
  
    modalClose.addEventListener("click", () => {
      modal.classList.remove("is-open");
    });
  </script>
  </body>
