<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products • MESS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header class="topbar">
      <nav class="nav">
        <a class="nav__link" href="./discover.html">Discover</a>
        <a class="nav__link" href="./about.html">About</a>

        <a class="nav__logo" href="./index.html">
          <img src="./images/MESS_Logo.png" alt="MESS logo" />
        </a>

        <a class="nav__link" href="./products.html">Products</a>
        <a class="nav__link" href="./play.html">Play</a>
      </nav>
    </header>

    <main class="page">
      <section class="products-banner">
        <div class="products-banner__inner">
          <h1 class="products-banner__title">MESS</h1>
        </div>
      </section>

      <section class="products-section">
        <div class="products-grid">
          <article class="product-card" data-size="MESS 01">
            <img src="./images/RainforestJacket.png" alt="Rain Jacket" />
            <img class="product-img product-img--editorial" src="./images/EditorialRJ.png" alt="Rain Jacket editorial" />
          </article>

          <article class="product-card" data-size="MESS 02">
            <img src="./images/RainforestTop.png" alt="Nylon Top" />
            <img class="product-img product-img--editorial" src="./images/EditorialRT.png" alt="Rain Top editorial" />
          </article>

          <article class="product-card" data-size="MESS 03">
            <img src="./images/RainforestPant.png" alt="Convertable Pants" />
            <img class="product-img product-img--editorial" src="./images/EditorialRP.png" alt="Rain Pant editorial" />
          </article>

          <article class="product-card" data-size="MESS 04">
            <img src="./images/AlpineJacket.png" alt="Shell Jacket" />
            <img class="product-img product-img--editorial" src="./images/EditorialAJ.png" alt="Alpine Jacket editorial" />
          </article>

          <article class="product-card" data-size="MESS 05">
            <img src="./images/AlpineBaseLayer.png" alt="Fleece Base Layer" />
            <img class="product-img product-img--editorial" src="./images/EditorialAB.png" alt="Alpine Base Layer editorial" />
          </article>

          <article class="product-card" data-size="MESS 06">
            <img src="./images/AlpinePants.png" alt="Shell Pants" />
            <img class="product-img product-img--editorial" src="./images/EditorialAP.png" alt="Alpine Pant editorial" />
          </article>

          <article class="product-card" data-size="MESS 07">
            <img src="./images/CoastJacket.png" alt="Heavy-duty Rain Jacket" />
            <img class="product-img product-img--editorial" src="./images/EditorialCJ.png" alt="Coast Jacket editorial" />
          </article>

          <article class="product-card" data-size="MESS 08">
            <img src="./images/CoastBaseLayer.png" alt="Fleece Zip-Up" />
            <img class="product-img product-img--editorial" src="./images/EditorialCB.png" alt="Coast Top editorial" />
          </article>

          <article class="product-card" data-size="MESS 09">
            <img src="./images/CoastPants.png" alt="Rain Pants" />
            <img class="product-img product-img--editorial" src="./images/EditorialCP.png" alt="Coast Pants editorial" />
          </article>

          <article class="product-card" data-size="MESS 10">
            <img class="product-img product-img--png product-img--jacket-down" src="./images/DJV2.png" alt="Wind Breaker" />
            <img class="product-img product-img--editorial" src="./images/EditorialDJ.png" alt="Desert Jacket editorial" />
          </article>

          <article class="product-card" data-size="MESS 11">
            <img class="product-img product-img--png product-img--top-up" src="./images/DSV2.png" alt="Tech Top" />
            <img class="product-img product-img--editorial" src="./images/EditorialDT.png" alt="Desert Top editorial" />
          </article>

          <article class="product-card" data-size="MESS 12">
            <img src="./images/DesertSkort.png" alt="Nylon Skort" />
            <img class="product-img product-img--editorial" src="./images/EditorialDS.png" alt="Desert Pant editorial" />
          </article>
        </div>
      </section>
    </main>
    <div id="footer-placeholder"></div>

    <script>
    fetch('/footer.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('footer-placeholder').innerHTML = data;
      });
  </script>
  </body>
</html>
